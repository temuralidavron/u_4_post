<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Website{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        nav {
            background-color: darkblue;
            padding: 10px 0;
            text-align: center;
        }
        nav ul {
            list-style: none;
            display: inline-flex;
        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        nav ul li a:hover {
            background-color: #555;
        }
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: start;
        }
        .posts-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }
        .post-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .post-card:hover {
            transform: translateY(-5px);
        }
        .post-card h1 {
            font-size: 20px;
            margin: 10px 0;
            color: darkblue;
        }
        footer {
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

<nav>
    <ul>
        {% for m in menu %}
            <li><a href="#">{{ m }}</a></li>
        {% endfor %}
                    <li><a href="{% url 'post-list' %}">Post </a></li>

    </ul>
</nav>

<div class="content">
    {% block content %}{% endblock %}
</div>

<footer>
    &copy; {{ now|date:"Y" }} My Website. Barcha huquqlar himoyalangan.
</footer>

</body>
</html>
